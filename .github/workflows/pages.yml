name: Deploy to GitHub Pages

# Publishes the static site to the gh-pages branch (GitHub Pages source) on every
# merge to main, then polls the live URL until it serves this exact commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://piratekinginc.github.io/test-m8/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Never deploy red
        run: npm test
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src _site/
          echo "$GITHUB_SHA" > _site/version.txt
          touch _site/.nojekyll
      - name: Publish to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
      - name: Poll live URL until it returns 200 with this commit
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL")
            live=$(curl -s "${SITE_URL}version.txt?nocache=$i" || true)
            echo "attempt $i: $SITE_URL -> $code, live version ${live:-none}"
            if [ "$code" = "200" ] && [ "$live" = "$GITHUB_SHA" ]; then exit 0; fi
            sleep 10
          done
          echo "Site never served $GITHUB_SHA with HTTP 200" >&2
          exit 1
