<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prism Outpost</title>
  <link rel="stylesheet" href="src/game/hud.css">
</head>
<body>
  <div id="game"></div>
  <div id="hud-top" class="hud">
    <span class="brand">PRISM OUTPOST</span>
    <span>Lumen <b id="lumen">0</b></span>
    <span>Units <b id="unit-count">0</b></span>
    <span>Supply <b id="supply">0/0</b></span>
    <span class="dim">Phase 1 sandbox, no opponent · <kbd>`</kbd> dev panel</span>
    <button id="fullscreen" title="Fullscreen with keyboard lock: lets Ctrl+1-9 reach the game in Chrome">Fullscreen</button>
    <span id="sound" class="dim"></span>
    <span id="fps" class="dim"></span>
  </div>
  <div id="toast"></div>
  <div id="dev-panel" class="hud" hidden>
    <div class="dev-title">DEV · test targets (verification only, not a game feature)</div>
    <p class="dim">Click a type, then click the map (Shift+click to place several). Team-2 units only fight back when in range; there is no AI.</p>
    <button data-spawn="dummy">Test target</button><button data-spawn="drone">Drone</button><button data-spawn="striker">Striker</button>
    <button data-spawn="sparker">Sparker</button><button data-spawn="bulwark">Bulwark</button><button data-spawn="lancer">Lancer</button>
  </div>
  <div id="groups" title="Control groups: click to select, Shift-click or right-click to assign the current selection (keys: Shift+1-9 assign, 1-9 select)"></div>
  <div id="hud-bottom" class="hud">
    <div id="selection-panel"></div>
    <div id="command-card"></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pathfinding@0.4.18/visual/lib/pathfinding-browser.min.js"></script>
  <script type="module" src="src/game/main.js"></script>
</body>
</html>
